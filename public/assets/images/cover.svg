<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 850" role="img" aria-label="A mischievous cartoon kid tiptoes across a moonlit bedroom while a man sleeps">
<defs>
 <linearGradient id="room" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#40325d"/><stop offset=".65" stop-color="#302644"/><stop offset="1" stop-color="#1c1b32"/></linearGradient>
 <linearGradient id="planks" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#937188"/><stop offset="1" stop-color="#51435b"/></linearGradient>
 <linearGradient id="sweater" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#77eac4"/><stop offset=".55" stop-color="#36bd9f"/><stop offset="1" stop-color="#0e787a"/></linearGradient>
 <linearGradient id="skin" x1=".2" y1="0" x2=".9" y2="1"><stop stop-color="#ffd8ae"/><stop offset="1" stop-color="#ec916b"/></linearGradient>
 <linearGradient id="covers" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#b9a8ff"/><stop offset=".55" stop-color="#7067ba"/><stop offset="1" stop-color="#51498e"/></linearGradient>
 <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff6ca"/><stop offset="1" stop-color="#dce3ff"/></linearGradient>
 <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#141d47"/><stop offset="1" stop-color="#445b8d"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#b6c3ff" stop-opacity=".5"/><stop offset="1" stop-color="#a9b8ff" stop-opacity="0"/></radialGradient>
 <radialGradient id="lamp"><stop stop-color="#ffd89d" stop-opacity=".64"/><stop offset="1" stop-color="#ffb76c" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="13" stdDeviation="12" flood-color="#141126" flood-opacity=".56"/></filter>
 <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="22"/></filter>
