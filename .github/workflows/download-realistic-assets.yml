name: Download licensed 3D game assets
on:
  push:
    branches:
      - feature/first-person-3d-three-levels
    paths:
      - .github/workflows/download-realistic-assets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-polyhaven-art:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/first-person-3d-three-levels
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download CC0 1K models and material maps
        working-directory: fps
        run: node scripts/sync-assets.mjs
      - name: Validate downloaded assets on disk
        shell: bash
        run: |
          test -s fps/public/models/manifest.json
          find fps/public/models -type f | wc -l
          du -sh fps/public/models
      - name: Commit real art assets to the game branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f fps/public/models
          if ! git diff --cached --quiet; then
            git commit -m "assets(cc0): bundle high-detail Poly Haven art for all three levels"
            git push origin HEAD:feature/first-person-3d-three-levels
          fi
