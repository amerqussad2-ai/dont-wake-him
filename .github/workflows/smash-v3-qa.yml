name: Smash District V3 browser QA
on:
  push:
    branches: [feature/smash-district-v3]
    paths: ['smash-district/**', '.github/workflows/smash-v3-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smash-v3-fast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/smash-district-v3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app packages
        working-directory: smash-district
        run: npm install --no-package-lock
      - name: Compile production site
        working-directory: smash-district
        run: npm run build
      - name: Prepare browser
        working-directory: smash-district
        run: |
          npm install --no-save --no-package-lock playwright
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install chromium --with-deps
          fi
      - name: Start Vite preview
        working-directory: smash-district
        run: |
          (npx vite preview --host 127.0.0.1 --port 4173 > /tmp/smash-v3.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/smash-v3.log
          exit 1
      - name: Run real-browser tests
        working-directory: smash-district
        run: node tests/v3-smoke.mjs
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smash-v3-screens
          path: |
            smash-district/v3-desktop.png
            smash-district/v3-mobile.png
          if-no-files-found: ignore
