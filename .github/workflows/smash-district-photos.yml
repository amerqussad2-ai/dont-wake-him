name: Bundle burger photography
on:
  push:
    branches: [feature/smash-district-dubai]
    paths:
      - .github/workflows/smash-district-photos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/smash-district-dubai
      - name: Fetch photos for first-party hosting
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smash-district/public/assets
          fetch_image() {
            local file="$1" id="$2" width="$3"
            echo "Downloading $file ($id)"
            if ! curl --fail --location --retry 2 --connect-timeout 12 --max-time 55 --silent --show-error \
              -H "User-Agent: SmashDistrictDemo/1.0" \
              "https://images.unsplash.com/$id?fm=jpg&fit=crop&w=$width&q=84" \
              -o "smash-district/public/assets/$file.jpg"; then
              echo "Original photo unavailable: using licensed signature burger backup for $file"
              curl --fail --location --retry 2 --connect-timeout 12 --max-time 55 --silent --show-error \
                "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?fm=jpg&fit=crop&w=$width&q=84" \
                -o "smash-district/public/assets/$file.jpg"
            fi
            test "$(wc -c < "smash-district/public/assets/$file.jpg")" -gt 7000
            file "smash-district/public/assets/$file.jpg"
          }
          fetch_image hero photo-1678110707493-8d05425137ac 1450
          fetch_image district photo-1568901346375-23c9450c58cd 900
          fetch_image truffle photo-1550547660-d9450f859349 900
          fetch_image habibi photo-1571091718767-18b5b1457add 900
          fetch_image chicken photo-1644940733241-d2512327ed2b 900
          fetch_image fries photo-1573080496219-bb080dd4f877 900
          fetch_image fries2 photo-1630384060421-cb20d0e0649d 900
          fetch_image drink photo-1437418747212-8d9709afab22 900
          fetch_image soda photo-1437418747212-8d9709afab22 900
          fetch_image burger2 photo-1561758033-d89a9ad46330 900
          fetch_image burger3 photo-1550317138-10000687a72b 900
          fetch_image burger4 photo-1528605248644-14dd04022da1 900
          fetch_image burger5 photo-1606755962773-d324e0a13086 900
          fetch_image rings photo-1639024471283-03518883512d 900
          fetch_image loadedfries photo-1541592106381-b31e9677c0e5 900
          fetch_image shake photo-1572490122747-3968b75cc699 900
          fetch_image strawberry photo-1497534446932-c925b458314e 900
          fetch_image icecream photo-1563805042-7684c019e1cb 900
          fetch_image brownie photo-1488477181946-6428a0291777 900
          fetch_image sundae photo-1570197788417-0e82375c9371 900
          du -sh smash-district/public/assets
      - name: Commit bundled art
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smash-district/public/assets/
          if ! git diff --cached --quiet; then
            git commit -m "assets(smash-district): locally host licensed food photography"
            git push origin HEAD:feature/smash-district-dubai
          fi
